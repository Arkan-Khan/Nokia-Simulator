<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nokia 5130 XpressMusic Emulator</title>
  <style>
    body {
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .phone {
      position: relative;
      width: 229px;
      height: 527px;
      background: url('assets/images/Nokia.png') no-repeat center/contain;
      cursor: default;
    }
    .screen {
      position: absolute;
      left: 36px;
      top: 99px;
      width: 152px;
      height: 202px;
      border: 1px solid #000;
      overflow: hidden;
      background: #000;
    }
    
    /* Screen content styles */
    .screen-content {
      width: 100%;
      height: 100%;
      position: relative;
      background-size: cover;
      background-position: center;
      color: white;
      font-family: "Nokia Sans", Arial, sans-serif;
    }
    
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .status-info {
      position: absolute;
      top: 5px;
      left: 5px;
      font-size: 10px;
      font-weight: normal;
      color: white;
      line-height: 1.2;
    }
    
    .status-info div {
      margin-bottom: 2px;
    }
    
    .time-display {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 12px;
      font-weight: bold;
      text-align: right;
    }
    
    
    .soft-keys {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 25px;
      background: rgba(80, 20, 40, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: normal;
    }
    
    .soft-key {
      color: white;
    }
    
    /* Dialer Screen Styles */
    .dialer-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      background: #000;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      font-size: 10px;
      font-weight: bold;
    }
    
    .dialer-content {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      bottom: 30px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      background: #fff;
      padding: 10px;
    }
    
    .dialed-number {
      font-size: 24px;
      font-weight: bold;
      color: #000;
      text-align: right;
      font-family: "Nokia Sans", Arial, sans-serif;
    }
    
    .dialer-soft-keys {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }
    
    /* Calling Screen Styles */
    .calling-content {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      background: #1a5fb4;
      padding: 10px;
    }
    
    .calling-status {
      font-size: 14px;
      font-weight: normal;
      color: white;
      margin-bottom: 10px;
      font-family: "Nokia Sans", Arial, sans-serif;
    }
    
    .calling-number {
      font-size: 18px;
      font-weight: bold;
      color: white;
      font-family: "Nokia Sans", Arial, sans-serif;
    }
    
    .calling-soft-keys {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }
    
    /* Menu Screen Styles */
    .menu-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      font-size: 10px;
      font-weight: bold;
    }
    
    .app-name-display {
      position: absolute;
      top: 25px;
      left: 10px;
      font-size: 10px;
      font-weight: bold;
      color: white;
      text-align: left;
      font-family: "Nokia Sans", Arial, sans-serif;
    }
    
    .app-grid {
      position: absolute;
      top: 40px;
      left: 10px;
      right: 10px;
      bottom: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 6px;
    }
    
    .app-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s ease;
    }
    
    .app-icon img {
      width: 32px;
      height: 32px;
      z-index: 2;
      position: relative;
    }
    
    .app-icon.focused::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: rgba(255, 100, 150, 0.4);
      border-radius: 6px;
      border: 2px solid rgba(255, 100, 150, 0.8);
      box-shadow: 0 0 10px rgba(255, 100, 150, 0.5);
      z-index: 1;
    }
    
    .menu-soft-keys {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: rgba(0, 0, 0, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 10px;
      font-weight: bold;
      color: white;
    }
    
    .menu-soft-keys .soft-key:first-child,
    .menu-soft-keys .soft-key:last-child {
      font-size: 8px;
    }
    
    .menu-soft-keys .soft-key:nth-child(2) {
      font-size: 10px;
    }
    .button {
      position: absolute;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.1s;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.1);
    }
    .button:active {
      opacity: 0.7;
    }
    /* Soft keys */
    .left-soft { left: 35px; top: 320px; width: 35px; height: 20px; }
    .right-soft { left: 153px; top: 320px; width: 35px; height: 20px; }
    
    /* Call buttons */
    .call-green { left: 35px; top: 348px; width: 35px; height: 20px; }
    .call-red { left: 153px; top: 348px; width: 35px; height: 20px; }
    
    /* D-pad */
    .dpad-up { left: 91px; top: 305px; width: 40px; height: 9px; }
    .dpad-down { left: 91px; top: 360px; width: 40px; height: 9px; }
    .dpad-left { left: 77px; top: 325px; width: 10px; height: 40px; }
    .dpad-right { left: 135px; top: 325px; width: 10px; height: 40px; }
    .dpad-center { left: 94px; top: 326px; width: 33px; height: 25px; }
    
    /* Number pad - 3 columns */
    .key-1 { left: 35px; top: 380px; width: 34px; height: 20px; }
    .key-2 { left: 95px; top: 380px; width: 34px; height: 20px; }
    .key-3 { left: 150px; top: 380px; width: 34px; height: 20px; }
    
    .key-4 { left: 35px; top: 406px; width: 34px; height: 20px; }
    .key-5 { left: 95px; top: 406px; width: 34px; height: 20px; }
    .key-6 { left: 150px; top: 406px; width: 34px; height: 20px; }
    
    .key-7 { left: 35px; top: 433px; width: 34px; height: 20px; }
    .key-8 { left: 95px; top: 433px; width: 34px; height: 20px; }
    .key-9 { left: 150px; top: 433px; width: 34px; height: 20px; }
    
    .key-star { left: 45px; top: 460px; width: 30px; height: 20px; }
    .key-0 { left: 95px; top: 460px; width: 30px; height: 20px; }
    .key-hash { left: 145px; top: 460px; width: 30px; height: 20px; }
  </style>
</head>
<body>
  <div class="phone">
    <div id="screen" class="screen">
      <!-- Screen content will be dynamically inserted here -->
    </div>
    
    <!-- Soft Keys -->
    <div class="button left-soft" data-key="LSK"></div>
    <div class="button right-soft" data-key="RSK"></div>
    
    <!-- Call Buttons -->
    <div class="button call-green" data-key="CALL"></div>
    <div class="button call-red" data-key="END"></div>
    
    <!-- D-Pad -->
    <div class="button dpad-up" data-key="UP"></div>
    <div class="button dpad-down" data-key="DOWN"></div>
    <div class="button dpad-left" data-key="LEFT"></div>
    <div class="button dpad-right" data-key="RIGHT"></div>
    <div class="button dpad-center" data-key="OK"></div>
    
    <!-- Number Pad -->
    <div class="button key-1" data-key="1"></div>
    <div class="button key-2" data-key="2"></div>
    <div class="button key-3" data-key="3"></div>
    <div class="button key-4" data-key="4"></div>
    <div class="button key-5" data-key="5"></div>
    <div class="button key-6" data-key="6"></div>
    <div class="button key-7" data-key="7"></div>
    <div class="button key-8" data-key="8"></div>
    <div class="button key-9" data-key="9"></div>
    <div class="button key-star" data-key="*"></div>
    <div class="button key-0" data-key="0"></div>
    <div class="button key-hash" data-key="#"></div>
  </div>

  <!-- Load all modules -->
  <script src="components/utils/Logger.js"></script>
  <script src="components/utils/TimeFormatter.js"></script>
  <script src="components/system/PhoneState.js"></script>
  <script src="components/system/AudioManager.js"></script>
  <script src="components/system/AssetLoader.js"></script>
  <script src="components/utils/PhotoStore.js"></script>
  <script src="components/utils/CallLogStore.js"></script>
  <script src="components/utils/ContactsStore.js"></script>
  <script src="components/ui/LongPressDetector.js"></script>
  <script src="components/screen/BootScreen.js"></script>
  <script src="components/screen/HomeScreen.js"></script>
  <script src="components/screen/PowerOffScreen.js"></script>
  <script src="components/screen/DialerScreen.js"></script>
  <script src="components/screen/MenuScreen.js"></script>
  <script src="components/screen/CameraScreen.js"></script>
  <script src="components/screen/GalleryScreen.js"></script>
  <script src="components/screen/CallsScreen.js"></script>
  <script src="components/screen/ContactsScreen.js"></script>
  <script src="components/screen/CalculatorScreen.js"></script>
  <script src="components/screen/ScreenManager.js"></script>
  <script src="scripts/boot.js"></script>

  <script>
    // Initialize the Nokia 5130 boot system
    document.addEventListener('DOMContentLoaded', async () => {
      const screenElement = document.getElementById('screen');
      const bootController = new BootController();
      
      try {
        await bootController.initialize(screenElement);
      } catch (error) {
        console.error('[MAIN] Failed to initialize emulator:', error);
      }
    });
  </script>
</body>
</html>
